<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إقرا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fafafa;
            color: #222;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p.subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        input.search {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            background: #fff;
            box-sizing: border-box;
            margin-bottom: 25px;
            font-family: 'Cairo', sans-serif;
        }
        input.search:focus {
            border-color: #222;
        }
        .book-item {
            background: #fff;
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .book-item:hover {
            border-color: #999;
        }
        .book-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .book-action {
            fn-size: 0.9rem;
            color: #555;
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>منصة إقرا</h1>
        <p class="subtitle">مكتبة رقمية مرتبة ومبسطة</p>

        <input type="text" id="search" class="search" placeholder="ابحث عن كتاب...">

        <div id="books-list">
            <div class="loading">جاري التحميل...</div>
        </div>
    </div>

    <script>
        let allBooks = [];

        fetch('data/books-list.json')
            .then(res => res.json())
            .then(data => {
                // يتعامل مع ملفك سواء كان مصفوفة مباشرة أو بداخله مفتاح books
                allBooks = Array.isArray(data) ? data : (data.books || []);
                render(allBooks);
            })
            .catch((err) => {
                console.error(err);
                document.getElementById('books-list').innerHTML = '<p style="color:red; text-align:center;">تعذر تحميل قائمة الكتب.</p>';
            });

        function render(books) {
            const list = document.getElementById('books-list');
            if (!books || books.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">لا توجد نتائج.</p>';
                return;
            }
            list.innerHTML = books.map(book => `
                <a href="reader.html?file=${book.file}" class="book-item">
                    <span class="book-title">${book.title}</span>
                    <span class="book-action">اقرأ</span>
                </a>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = allBooks.filter(b => b.title && b.title.toLowerCase().includes(term));
            render(filtered);
        });
    </script>
</body>
</html>
