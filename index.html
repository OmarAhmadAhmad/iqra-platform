 لنبينا صلى الله عليه وسلم: اقرأ، كان يفتح باباً لا يُغلق من النور. اقرأ لتفهم نفسك، واقرأ لتفهم ربك، واقرأ لتفهم رسالتك في هذه الحياة.","ابدأ بخمس عشرة دقيقة كل يوم، لا أكثر. اجعلها كصلاة الضحى، عادة صغيرة مباركة تنمو مع الوقت. لا تستعجل الثمرة، فإن الغرس الصغير يصير شجرة وارفة بالصبر."]},{id:2,title:"زاد الطالب الصغير",description:"وجبات معرفية خفيفة تناسب طلاب العلم في بداية الطريق.",category:"masabih",level:"مبتدئ",readingTime:"12 دقيقة",minutes:12,coverColor:"#6a1b9a",icon:"\uD83C\uDF31",featured:!1,content:["العلم كالماء، قليله يروي وكثيره يُغرق إذا لم يُحسن الشرب. فخذ من العلم جرعات صغيرة منتظمة، خير من جرعة كبيرة متقطعة.","قال ابن القيم: العلم يهتف بالعمل فإن أجابه وإلا ارتحل. فكل معلومة تقرأها، حاول أن تعمل بها ولو مرة واحدة."]},{id:3,title:"نور البدايات",description:"كيف تبدأ رحلتك مع الكتاب وتحافظ على الشغف دون ملل.",category:"masabih",level:"مبتدئ",readingTime:"10 دقائق",minutes:10,coverColor:"#7b1fa2",icon:"\uD83D\uDCA1",featured:!0,content:["كثيرون يبدؤون ولا يُكملون، لأنهم يظنون أن القراءة تحتاج ساعات طوال. الحقيقة أن القليل الدائم خير من الكثير المنقطع."]},{id:4,title:"صحبة الكتاب",description:"آداب التعامل مع الكتاب وكيف تجعله صديقاً وفياً.",category:"masabih",level:"مبتدئ",readingTime:"14 دقيقة",minutes:14,coverColor:"#4a148c",icon:"\uD83D\uDCD6",featured:!1,content:["كان السلف يسمون الكتاب الجليس الصالح، لأنه لا يمل ولا ينم ولا يغتاب."]},{id:5,title:"همة الشباب",description:"رسائل تحفيزية للشباب المسلم لإحياء همة القراءة والطلب.",category:"masabih",level:"مبتدئ",readingTime:"13 دقيقة",minutes:13,coverColor:"#8e24aa",icon:"⚡",featured:!1,content:["يا شباب الأمة، أنتم أملها وذخرها، ولن تنهض الأمة إلا بعلمكم وعملكم."]},{id:6,title:"خمس عشرة دقيقة",description:"منهجية المصابيح: كيف تغير حياتك بربع ساعة يومياً.",category:"masabih",level:"مبتدئ",readingTime:"15 دقيقة",minutes:15,coverColor:"#6a1b9a",icon:"⏳",featured:!0,content:["فكرة هذا الكتاب بسيطة: 15 دقيقة فقط. ضع هاتفك جانباً، افتح كتابك، واقرأ."]},{id:7,title:"بساتين المعرفة",description:"جولة في حدائق العلماء وكيف كانوا يطلبون العلم.",category:"masabih",level:"مبتدئ",readingTime:"18 دقيقة",minutes:18,coverColor:"#4a148c",icon:"\uD83C\uDF3F",featured:!1,content:["كان الإمام أحمد يحمل المحبرة حتى يرى أثرها على ثوبه، فقيل له: إلى متى؟ قال: مع المحبرة إلى المقبرة."]},{id:8,title:"مفاتيح الفهم",description:"أدوات أولية لفهم النصوص والتعامل معها بوعي.",category:"masabih",level:"مبتدئ",readingTime:"16 دقيقة",minutes:16,coverColor:"#7b1fa2",icon:"\uD83D\uDDDD️",featured:!1,content:["الفهم رزق، وكما يُرزق الإنسان المال، يُرزق الفهم."]},{id:9,title:"قلب يقرأ",description:"القراءة القلبية: كيف نقرأ بقلوبنا لا بأعيننا فقط.",category:"masabih",level:"مبتدئ",readingTime:"12 دقيقة",minutes:12,coverColor:"#6a1b9a",icon:"❤️",featured:!1,content:["هناك قراءة بالعين، وقراءة بالقلب. الأولى تملأ العقل، والثانية تملأ الروح."]},{id:10,title:"طريق النور",description:"خاتمة مسار المصابيح وبداية الانطلاق لما بعده.",category:"masabih",level:"مبتدئ",readingTime:"20 دقيقة",minutes:20,coverColor:"#4a148c",icon:"\uD83C\uDF1F",featured:!0,content:["إذا أنهيت هذه المجموعة، فأنت الآن مستعد للانتقال إلى مسار أعمق."]},{id:11,title:"صفة صلاة النبي",description:"كأنك تراه يصلي: شرح مفصل لصفة صلاة النبي ﷺ من التكبير إلى التسليم.",category:"salah",level:"متوسط",readingTime:"25 دقيقة",minutes:25,coverColor:"#1b4d3e",icon:"\uD83D\uDD4C",featured:!0,content:["الصلاة عماد الدين، وهي أول ما يحاسب عليه العبد يوم القيامة. فإذا صلحت صلح سائر العمل.","كان النبي ﷺ يقف في الصلاة حتى تتفطر قدماه، ويقول: أفلا أكون عبداً شكوراً."]},{id:12,title:"الخشوع في الصلاة",description:"أسباب الخشوع وموانعه، مع تطبيقات عملية لحضور القلب.",category:"salah",level:"متوسط",readingTime:"22 دقيقة",minutes:22,coverColor:"#204e3a",icon:"\uD83E\uDD32",featured:!0,content:["الخشوع هو روح الصلاة، وبدونه تصبح حركات بلا معنى."]},{id:13,title:"أسرار الفاتحة",description:"تأملات في سورة الفاتحة ومعانيها العميقة في كل ركعة.",category:"salah",level:"متوسط",readingTime:"18 دقيقة",minutes:18,coverColor:"#1b4d3e",icon:"\uD83D\uDCDC",featur
