<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إقرا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            color: #bdc3c7;
            font-size: 1.1rem;
        }
        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            border: 1px solid #ccd1d1;
            border-radius: 10px;
            margin-bottom: 25px;
            outline: none;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #3498db;
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: #fff;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 4px solid #3498db;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        .book-card h3 {
            font-size: 1.25rem;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .book-card p {
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 10px 18px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .loading, .error-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.2rem;
            color: #7f8c8d;
        }
        .error-msg {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة إقرا</h1>
        <p>المكتبة الرقمية وسلسلة المصابيح</p>
    </header>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <input type="text" id="search-input" class="search-box" placeholder="ابحث عن كتاب أو مصباح...">

        <!-- حاوية الكتب -->
        <div class="books-grid" id="books-container">
            <div class="loading">جاري تحميل المكتبة الرقمية...</div>
        </div>
    </div>

    <script>
        let allBooks = [];

        // مسار ملف books-list.json داخل مجلد data
        const jsonPath = 'data/books-list.json';

        // جلب البيانات من ملف books-list.json
        fetch(jsonPath)
            .then(response => {
                if (!response.ok) {
                    throw new Error('تعذر الوصول إلى ملف قائمة الكتب (تأكد من مسار مجلد data وملف books-list.json)');
                }
                return response.json();
            })
            .then(books => {
                allBooks = books;
                displayBooks(allBooks);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('books-container').innerHTML = `
                    <div class="error-msg">
                        تعذر تحميل قائمة الكتب.<br>
                        <small style="color: #95a5a6; font-size: 0.9rem;">تأكد من رفع مجلد data وبد داخله ملف books-list.json على جيت هب.</small>
                    </div>
                `;
            });

        // دالة لعرض الكتب في البطاقات
        function displayBooks(books) {
            const container = document.getElementById('books-container');
            if (!books || books.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد كتب مطابقة لبحثك.</div>';
                return;
            }

            container.innerHTML = books.map(book => `
                <div class="book-card">
                    <div>
                        <h3>${book.title || 'كتاب بدون عنوان'}</h3>
                        <p>${book.category || 'قسم المصابيح والأذكار'}</p>
                    </div>
                    <a href="reader.html?file=${book.file}" class="btn">قراءة الكتاب</a>
                </div>
            `).join('');
        }

        // تفعيل البحث الفوري
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = allBooks.filter(book => 
                book.title && book.title.toLowerCase().includes(term)
            );
            displayBooks(filtered);
        });
    </script>

</body>
</html>
