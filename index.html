<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الإسلامية الرقمية - الإصدار الفاخر</title>
    
    <!-- ربط ملف الـ Manifest وتهيئته للتثبيت كتطبيق على الموبايل (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="المكتبة الرقمية">
    
    <!-- التصميم والخطوط العربية الكلاسيكية -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الهيدر الفاخر -->
    <header class="app-header">
        <div class="header-content">
            <span class="badge-offline">🔒 تعمل أوفلاين بالكامل</span>
            <h1>المكتبة الإسلامية الرقمية</h1>
            <p>منصة تربوية وإيمانية شاملة لدراسة الفقه، العقيدة، المصابيح، والسيرة النبوية</p>
        </div>

        <!-- شريط التحكم والبحث المتقدم -->
        <div class="controls-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث في عناوين الكتب، الموضوعات، أو المصابيح...">
            </div>
            <button id="themeToggle" class="theme-btn" title="تغيير المظهر">🌓</button>
        </div>

        <!-- أزرار التصفية السريعة (الفلاتر) -->
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" data-category="all">الكل</button>
            <button class="tab-btn" data-category="العبادات والفقه">العبادات والفقه</button>
            <button class="tab-btn" data-category="دروس ومحاضرات الصلاة">الصلاة</button>
            <button class="tab-btn" data-category="دروس ومحاضرات الصيام">الصيام</button>
            <button class="tab-btn" data-category="أسماء الله الحسنى">أسماء الله الحسنى</button>
            <button class="tab-btn" data-category="المصابيح والأذكار">المصابيح والأذكار</button>
            <button class="tab-btn" data-category="الشخصيات الإسلامية والتراجم">التراجم والسيرة</button>
        </div>
    </header>

    <!-- منطقة عرض شبكة الكتب -->
    <main class="main-container">
        <div id="booksGrid" class="books-grid">
            <!-- يتم تعبئة بطاقات الكتب ديناميكياً بواسطة js/app.js -->
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="app-footer">
        <p>المكتبة الإسلامية الرقمية المباركة &copy; 2026</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">تطبيق ويب تقدمي (PWA) مخصص للقراءة الهادئة بدون إنترنت</p>
    </footer>

    <!-- ملف التشغيل البرمجي الرئيسي -->
    <script src="js/app.js"></script>

    <!-- تسجيل الـ Service Worker لتفعيل العمل أوفلاين والتثبيت على الهاتف -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker Registered Successfully:', reg.scope))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
