<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إقرأ | إقرأ باسم ربك</title>
    <!-- خط Cairo العصري والمريح للعين -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b4d3e;
            --primary-light: #2c7a63;
            --secondary-color: #d4af37;
            --bg-color: #f8f6f0;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #6c757d;
            --border-color: #e6dfd3;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        /* Dark Mode Theme */
        [data-theme="dark"] {
            --bg-color: #121816;
            --card-bg: #1e2623;
            --text-color: #e0e6e3;
            --text-muted: #9fae9a;
            --border-color: #2e3a35;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Cairo', serif, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }

        /* Header Layout */
        header {
            background: linear-gradient(135deg, var(--primary-color), #0d2820);
            color: white;
            padding: 2.5rem 1rem 3.5rem;
            text-align: center;
            position: relative;
            border-bottom: 4px solid var(--secondary-color);
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-family: inherit;
            font-size: 0.9rem;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 800;
            color: #f3e5ab;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0.5rem 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: -2rem auto 3rem;
            padding: 0 1.2rem;
            position: relative;
            z-index: 10;
        }

        /* Search & Filter Bar */
        .controls-card {
            background: var(--card-bg);
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            font-size: 1.05rem;
            font-family: inherit;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .search-box input:focus {
            border-color: var(--primary-light);
        }

        /* Categories Chips */
        .categories-chips {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.3rem;
            scrollbar-width: none;
        }

        .categories-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .chip.active, .chip:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Continue Reading Widget */
        .continue-reading {
            background: linear-gradient(to left, var(--primary-color), var(--primary-light));
            color: white;
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        .continue-reading .btn {
            background: var(--secondary-color);
            color: var(--primary-color);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .book-cover {
            height: 180px;
            background: linear-gradient(45deg, var(--primary-color), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f3e5ab;
            font-size: 3rem;
            position: relative;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.4);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fav-btn.active {
            color: #ff4757;
            background: white;
        }

        .book-details {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-badge {
            align-self: flex-start;
            background: rgba(212, 175, 55, 0.15);
            color: var(--secondary-color);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .book-title {
            color: var(--text-color);
            font-size: 1.25rem;
            margin: 0 0 0.3rem 0;
            font-weight: 700;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .book-desc {
            font-size: 0.92rem;
            color: var(--text-color);
            opacity: 0.85;
            margin-bottom: 1.2rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 0.6rem;
        }

        .read-btn {
            flex: 2;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 0.7rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .read-btn:hover {
            background-color: var(--primary-light);
        }

        .preview-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        /* Modal Quick View */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: var(--shadow);
        }

        .close-modal {
            position: absolute;
            top: 1rem; left: 1rem;
            background: none; border: none;
            font-size: 1.5rem; color: var(--text-muted);
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--card-bg);
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 الوضع الليلي</button>
        <h1>منصة إقرأ</h1>
        <p>مكتبتك الرقمية التفاعلية للمطالعة والتعلم السلس</p>
    </header>

    <div class="container">

        <!-- شريط متابعة القراءة -->
        <div id="continueWidget" class="continue-reading">
            <div>
                <small style="opacity: 0.8;">📖 متابعة القراءة الأخيرة</small>
                <h4 id="continueTitle" style="margin: 0.2rem 0 0 0;">عنوان الكتاب</h4>
            </div>
            <a id="continueLink" href="#" class="btn">متابعة الآن</a>
        </div>

        <!-- أدوات البحث والتصفية -->
        <div class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث باسم الكتاب، المؤلف، أو الفكرة..." onkeyup="filterBooks()">
            </div>
            <div class="categories-chips" id="categoriesContainer">
                <button class="chip active" onclick="filterCategory('الكل')">الكل</button>
                <button class="chip" onclick="filterCategory('سيرة وتاريخ')">سيرة وتاريخ</button>
                <button class="chip" onclick="filterCategory('فقه وشريعة')">فقه وشريعة</button>
                <button class="chip" onclick="filterCategory('عقيدة')">عقيدة</button>
                <button class="chip" onclick="filterCategory('المفضلة')">❤️ المفضلة</button>
            </div>
        </div>

        <!-- شبكة عرض الكتب -->
        <div id="booksContainer" class="books-grid">
            <!-- يتم تحميل الكتب ديناميكياً هنا -->
        </div>
    </div>

    <!-- نافذة المعاينة السريعة -->
    <div id="quickModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <span class="book-badge" id="modalCategory">تصنيف</span>
            <h2 id="modalTitle" style="margin: 0.5rem 0;">عنوان الكتاب</h2>
            <p id="modalAuthor" style="color: var(--text-muted); margin-bottom: 1rem;">المؤلف</p>
            <p id="modalDesc">وصف الكتاب التفصيلي ينزل هنا...</p>
            <div style="margin-top: 1.5rem; display: flex; gap: 0.8rem;">
                <a id="modalReadLink" href="#" class="read-btn">بدء القراءة الآن</a>
            </div>
        </div>
    </div>

    <footer>
        <p>منصة إقرأ التعليمية التفاعلية © 2026 | جميع الحقوق محفوظة</p>
    </footer>

    <script>
        let allBooks = [];
        let currentCategory = 'الكل';
        let favorites = JSON.parse(localStorage.getItem('iqra_favorites') || '[]');

        // تحميل وتطبيق الثيم المحفوظ
        if (localStorage.getItem('iqra_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('iqra_theme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('iqra_theme', 'dark');
            }
        }

        async function loadBooks() {
            try {
                const response = await fetch('data/books-list.json');
                const data = await response.json();
                allBooks = data.books;
                
                checkLastRead();
                filterBooks();
            } catch (error) {
                console.error('خطأ في تحميل الفهرس:', error);
                document.getElementById('booksContainer').innerHTML = 
                    '<p style="text-align:center; grid-column: 1/-1; color:#e74c3c;">تعذر تحميل مكتبة الكتب حالياً. التأكد من وجود ملف JSON.</p>';
            }
        }

        function checkLastRead() {
            const lastBook = JSON.parse(localStorage.getItem('iqra_last_read'));
            if (lastBook) {
                document.getElementById('continueTitle').textContent = lastBook.title;
                document.getElementById('continueLink').href = `reader.html?book=${lastBook.file}`;
                document.getElementById('continueWidget').style.display = 'flex';
            }
        }

        function displayBooks(books) {
            const container = document.getElementById('booksContainer');
            container.innerHTML = '';

            if (books.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 2rem;">لا توجد كتب تطابق خيارات البحث.</p>';
                return;
            }

            books.forEach(book => {
                const isFav = favorites.includes(book.file);
                const category = book.category || 'عام';
                
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover">
                        📖
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${book.file}', event)">
                            ${isFav ? '♥' : '♡'}
                        </button>
                    </div>
                    <div class="book-details">
                        <span class="book-badge">${category}</span>
                        <h3 class="book-title">${book.title}</h3>
                        <div class="book-author">تأليف: ${book.author}</div>
                        <p class="book-desc">${book.description}</p>
                        <div class="card-actions">
                            <a href="reader.html?book=${book.file}" class="read-btn" onclick="saveLastRead('${book.title}', '${book.file}')">اقرأ الآن</a>
                            <button class="preview-btn" onclick="openModal('${book.title}', '${book.author}', '${book.description.replace(/'/g, "\\'")}', '${book.file}', '${category}')">معاينة</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allBooks.filter(b => {
                const matchesQuery = b.title.toLowerCase().includes(query) ||
                                     b.author.toLowerCase().includes(query) ||
                                     b.description.toLowerCase().includes(query);

                const bookCat = b.category || 'عام';
                let matchesCategory = true;

                if (currentCategory === 'المفضلة') {
                    matchesCategory = favorites.includes(b.file);
                } else if (currentCategory !== 'الكل') {
                    matchesCategory = bookCat === currentCategory;
                }

                return matchesQuery && matchesCategory;
            });

            displayBooks(filtered);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            filterBooks();
        }

        function toggleFav(file, e) {
            e.stopPropagation();
            if (favorites.includes(file)) {
                favorites = favorites.filter(id => id !== file);
            } else {
                favorites.push(file);
            }
            localStorage.setItem('iqra_favorites', JSON.stringify(favorites));
            filterBooks();
        }

        function saveLastRead(title, file) {
            localStorage.setItem('iqra_last_read', JSON.stringify({ title, file }));
        }

        // Modal Functions
        function openModal(title, author, desc, file, category) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalAuthor').textContent = `تأليف: ${author}`;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('modalCategory').textContent = category;
            
            const readBtn = document.getElementById('modalReadLink');
            readBtn.href = `reader.html?book=${file}`;
            readBtn.onclick = () => saveLastRead(title, file);

            document.getElementById('quickModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('quickModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('quickModal');
            if (event.target === modal) closeModal();
        }

        loadBooks();
    </script>
</body>
</html>
