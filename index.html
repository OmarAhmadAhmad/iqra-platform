كل بداية مباركة تبدأ باسمه. حين تقول بسم الله، فأنت تعلن أن هذا الوقت له، وهذا القلب له، وهذه القراءة له.`,"ليست البسملة كلمة تقال، بل باب يفتح. من دخل منه، وجد النور. ومن استفتح يومه بها، كفاه الله.","اجعلها عادتك قبل كل شيء. قبل أن تقرأ، قبل أن تفهم، قبل أن تعمل. قلها بقلب حاضر، وسترى كيف يلين الصعب."]),z("m2","لماذا نقرأ؟",["نقرأ لأننا ننسى. والقراءة تذكير. تذكرنا من نحن، ولماذا خلقنا، وإلى أين نسير.","العلم ليس كثرة المعلومات، بل نور يقذفه الله في القلب. والقراءة الصادقة هي التي تبحث عن هذا النور، لا عن الجدل.","اقرأ لا لتمتلئ، بل لتتطهر. لا لتقول، بل لتعمل. كل سطر تقرأه بصدق، هو خطوة إلى الله."]),z("m3","النية الصافية",["النية هي روح العمل. بلا نية، العمل جسد بلا روح. وبالنية الصالحة، يصبح القليل كثيرا.","جدد نيتك قبل كل قراءة: أن أقرأ لأعرف ربي، لأزكي نفسي، لأصلح قلبي. لا رياء ولا سمعة، بل وجه الله وحده.","قال بعض السلف: تعلموا النية فإنها أبلغ من العمل. فما قيمة علم لا يراد به وجه الله؟"]),z("m4","أول آية",["اقرأ باسم ربك الذي خلق. أول ما نزل. لم يقل صلّ، ولم يقل صم، بل قال اقرأ. فالقراءة أصل العبادة.","اقرأ باسم ربك، لا باسم نفسك. لا تقرأ لتتباهى، بل لتتعرف على خالقك الذي خلقك من علق.","الذي علم بالقلم، علم الإنسان ما لم يعلم. كل علم هو منه، وكل فهم هو هبة، وكل نور هو عطاؤه."]),z("m5","القلب السليم",["يوم لا ينفع مال ولا بنون إلا من أتى الله بقلب سليم. ليس سليم الجسد، بل سليم القلب من الشرك والحقد والحسد.","القلب السليم هو الذي لا يحمل غلا لمؤمن، ولا حسدا، ولا كبرا. قلب كالمرآة الصافية، يرى الحق فيتبعه.","كيف يصفو القلب؟ بكثرة الذكر، وقلة الكلام، وصدق اللجوء إلى الله، ومجالسة الصالحين."]),z("m6","دقيقة تأمل",["قف دقيقة. تنفس. انظر حولك. كل هذا خلقه الله. السماء مرفوعة بلا عمد، والأرض مبسوطة، والقلب ينبض بلا أمر منك.","التأمل عبادة صامتة. لا تحتاج وضوءا ولا قبلة، تحتاج قلبا حاضرا. تفكر في خلق السماوات والأرض.","من تفكر في خلق الله ساعة، خير له من قيام ليلة. لأن الفكر يورث المعرفة، والمعرفة تورث الخشية."]),z("m7","ذكر الصباح",["إذا أصبحت فقل: أصبحنا وأصبح الملك لله. تذكر أن يومك ملك لله، ليس لك. أنت عبد، ولست مالكا.","اذكر الله في الرخاء يذكرك في الشدة. اذكره وأنت قوي، يذكرك وأنت ضعيف. اذكره في النعمة، يحفظك في النقمة.","أذكار الصباح ليست كلمات، بل حصن. من دخل حصن الذكر، أمن من همزات الشياطين ووساوس النفس."]),z("m8","نور على نور",["الله نور السماوات والأرض. كل نور في الكون هو أثر من نوره. نور الشمس، نور القمر، نور القلب المؤمن.","مثل نوره كمشكاة فيها مصباح. قلب المؤمن كمشكاة، والإيمان مصباح، والقرآن زيت يضيء ولو لم تمسسه نار.","إذا أراد الله بعبده خيرا، قذف في قلبه نورا. فإذا دخل النور القلب، انفسح وانشرح."]),z("m9","بداية الطريق",["الطريق إلى الله يبدأ بخطوة واحدة صادقة. لا يطلب منك أن تصل اليوم، بل أن تبدأ اليوم.","لا تنظر إلى طول الطريق، انظر إلى صدق البداية. ومن صدق مع الله في البداية، بلغه الله النهاية.","قل يا رب، ها أنا ذا أقبل عليك. وستجد الله أسرع إليك من سعيك إليه. من أتاه يمشي، أتاه هرولة."]),z("m10","وقفة صادقة",["قف مع نفسك وقفة صدق. ماذا أريد؟ إلى أين أذهب؟ هل قلبي مع الله أم مع الدنيا؟","الوقفة الصادقة قد تغير عمرا كاملا. لحظة صدق مع الله، خير من سنوات غفلة.","لا تؤجل الوقفة. الآن. هذا السطر الذي تقرأه قد يكون هو الوقفة التي كتب الله لك بها النجاة."])]},{id:"salah",emoji:"\uD83D\uDD4C",title:"الصلاة والصيام",countLabel:"١٦ كتاب",subtitle:"الأساس",books:[z("s1","معنى الصلاة",["الصلاة صلة. صلة بين العبد وربه. خمس مرات في اليوم، يترك العبد كل شيء، ويقف بين يدي مولاه.","ليست حركات تؤدى، بل لقاء يتجدد. كلما وقفت للصلاة، تذكر أنك تقف أمام الملك.","من ذاق حلاوة الصلاة، لم يتركها ولو قطعت أطرافه. لأنها راحة القلب، وقرة العين."]),z("s2","الوضوء طهارة",["الوضوء ليس غسل أعضاء، بل غسل ذنوب. مع كل قطرة ماء، تتساقط الخطايا.","إذا توضأت، فاستشعر أنك تتطهر للقاء الله. لا تدخل على الملك إلا طاهرا نظيفا.","الماء طهور، والنية نور. فاجمع بينهما، تخرج من وضوئك كيوم ولدتك أمك."]),z("s3","القيام بين يدي الله",["حين تقول الله أكبر، فأنت تعلن أن الله أكبر من كل شيء يشغلك. أكبر من همك، من عملك، من دنياك.","القيام أدب. تقف مطرقا، خاشعا، كالعبد الذليل أمام سيده. لا تلتفت، ولا تعبث، فإنك في حضرة الملك.","اقرأ الفاتحة كأنك تخاطبه، ويخاطبك. إذا قلت الحمد لله، قال الله حمدني عبدي."]),z("s4","الفاتحة نور",["الفاتحة هي أم القرآن. سبع آيات، فيها كل معاني القرآن. حمد، وثناء، ودعاء.","إياك نعبد وإياك نستعين. هذه الآية هي خلاصة الدين كله. عبادة واستعانة، لا واحدة دون الأخرى.","اهدنا الصراط المستقيم. كل يوم تطلب الهداية، لأنك كل يوم قد تضل. فلا تمل من طلبها."]),z("s5","الركوع خضوع",["سبحان ربي العظيم. تسبح العظيم وأنت راكع، منحني الظهر، خاضع. لتعلم أن العظمة لله وحده.","الركوع انكسار. تنكسر لله، فيرفعك. تذل له، فيعزك. تخضع له، فيكرمك.","أطل ركوعك، وأحضر قلبك. فإن الله ينظر إلى قلبك، لا إلى سرعة حركتك."]),z("s6","السجود قرب",["أقرب ما يكون العبد من ربه وهو ساجد. فإذا أردت أن تكون قريبا، فأكثر من السجود.","في السجود تضع أشرف ما فيك — وجهك — على الأرض، لله. وهذا غاية الذل، وغاية العز في آن واحد.","ادع في سجودك بما شئت. فإنه موطن إجابة. وابك إن استطعت، فإن الدمعة في السجود غالية عند الله."]),z("s7","التشهد عهد",["التحيات لله والصلوات والطيبات. كل تحية وكل صلاة وكل طيب هو لله.","السلام علينا وعلى عباد الله الصالحين. في صلاتك تذكر إخوانك الصالحين في كل مكان، وتسلم عليهم.","التشهد عهد تجدده في كل صلاة: أشهد أن لا إله إلا الله، وأشهد أن محمدا عبده ورسوله."]),z("s8","صلاة الفجر",["صلاة الفجر نور في القلب، وبركة في اليوم، وحفظ من الله. من صلى الفجر فهو في ذمة الله.","الناس نيام، وأنت قائم بين يدي الله. أي شرف هذا؟ وأي اصطفاء؟","لا تترك الفجر ولو كنت مريضا متعبا. فمن حافظ عليها، حفظه الله في يومه كله."]),z("s9","صلاة الجماعة",["صلاة الجماعة تفضل صلاة الفذ بسبع وعشرين درجة. فلا تحرم نفسك هذا الفضل.","حين تقف في الصف، أنت جزء من جسد واحد. الكتف إلى الكتف، والقلب إلى القلب.","المسجد بيت الله. ومن اعتاد المسجد، اعتاده الملك، وأحبه أهل السماء."]),z("s10","الخشوع",["الخشوع ليس بكاء ولا صراخا، بل سكون القلب، وحضور الذهن، وذل الجوارح.","كيف أخشع؟ فرغ قلبك قبل الصلاة، وتذكر أنك ستقف أمام الله بعد قليل.","إذا خشع القلب، خشعت الجوارح. وإذا غفل القلب، عبثت الجوارح ولو تظاهرت بالخشوع."]),z("s11","معنى الصيام",["الصيام ترك. تترك الطعام والشراب والشهوة، لله. لتتعلم أنك تستطيع أن تترك لله كل شيء.","ليس الصيام عن الأكل فقط، بل عن اللغو والرفث والكذب والغيبة. صم بقلبك قبل بطنك.","كل عمل ابن آدم له إلا الصوم فإنه لي وأنا أجزي به. فما أكرم الجزاء إذا كان من الكريم نفسه؟"]),z("s12","رمضان شهر القرآن",["شهر رمضان الذي أنزل فيه القرآن. رمضان هو شهر القرآن، والقرآن هو روح رمضان.","كان جبريل يدارس النبي القرآن في رمضان كل ليلة. فاجعل لك وردا لا تتركه في هذا الشهر.","ليلة في رمضان خير من ألف شهر. فلا تضيع ساعاته في اللهو والأسواق."]),z("s13","ليلة القدر",["ليلة القدر خير من ألف شهر. عبادة ليلة واحدة تعدل عبادة ثلاث وثمانين سنة.","التمسوها في العشر الأواخر، في الوتر منها. وأكثروا فيها من قول: اللهم إنك عفو تحب العفو فاعف عني.","من قام ليلة القدر إيمانا واحتسابا غفر له ما تقدم من ذنبه. فلا تحرم نفسك قيامها."]),z("s14","زكاة الفطر",["زكاة الفطر طهرة للصائم من اللغو والرفث، وطعمة للمساكين. فلا تتركها.","أخرجها قبل صلاة العيد، فإن أخرجتها بعدها فهي صدقة من الصدقات.","أعطها لمن يستحقها بقلب طيب، واشكر الله أن جعلك معطيا لا آخذا."]),z("s15","صيام النوافل",["صيام الاثنين والخميس، ترفع فيه الأعمال إلى الله، وأحب أن يرفع عملي وأنا صائم.","صيام ثلاثة أيام من كل شهر كصيام الدهر. وصيام يوم عرفة يكفر سنتين.","الصوم جنة. وقاية من النار، وحماية من الشهوات، وتربية للنفس على الصبر."]),z("s16","العيد فرحة",["العيد فرحة أذن الله بها. افرح كما فرح النبي، وكبر كما كبر الصحابة.","العيد ليس لمن لبس الجديد، بل لمن طاعته تزيد. وليس لمن تجمل باللباس، بل لمن تجمل بالتقوى.","صلوا العيد، وهنئوا إخوانكم، وصلوا أرحامكم، وأدخلوا السرور على الفقراء والمساكين."])]},{id:"marifa",emoji:"✨",title:"المعرفة بالله",countLabel:"١٠ كتب",subtitle:"الأسماء والصفات",books:[z("k1","الله نور السماوات",["الله نور السماوات والأرض. نور حسّي ومعنوي. به تضاء القلوب، وبه تشرق الأرواح.","إذا فقدت النور، فقدت كل شيء. وإذا وجدت نور الله، وجدت كل شيء وإن فقدت كل شيء.","اطلب النور من مصدره. لا تطلبه من الناس، ولا من الدنيا. اطلبه من الله، يهبك نورا تمشي به في الناس."]),z("k2","الرحمن الرحيم",["الرحمن الرحيم. اسمان يملآن القلب رجاء. رحمن في الدنيا، رحيم في الآخرة. رحمن بالمؤمن والكافر، رحيم بالمؤمنين خاصة.","رحمته وسعت كل شيء. وسعت ذنوبك، وهمومك، وضعفك، وخوفك. فلا تقنط من رحمته أبدا.","إذا علمت أنه رحيم، أحببته. وإذا أحببته، أطعته. وإذا أطعته، رحمك رحمة لا شقاء بعدها."]),z("k3","الملك القدوس",["الملك: الذي يملك كل شيء، ويملك قلوب العباد. قلوب العباد بين إصبعين من أصابعه يقلبها كيف يشاء.","القدوس: المنزه عن كل نقص، المطهر عن كل عيب. فلا تظن به إلا خيرا، ولا تنسب إليه إلا كمالا.","إذا عرفت أنه الملك، لم تذل إلا له. ولم ترج إلا هو. ولم تخف إلا منه."]),z("k4","العليم الحكيم",["العليم: يعلم ما في قلبك قبل أن تنطق به. يعلم ضعفك، وحاجتك، ودمعتك التي تخفيها عن الناس.","الحكيم: لا يفعل شيئا عبثا. كل ما قضاه لحكمة، وكل ما منعه لحكمة، وكل ما أخره لحكمة.","سلم للعليم الحكيم، ترتح. فإنك لا تعلم، وهو يعلم. وأنت لا تحكم، وهو الحكيم."]),z("k5","الغفور الودود",["الغفور: يغفر الذنوب جميعا، مهما عظمت. لا يتعاظمه ذنب أن يغفره. فلا تستكثر ذنبك على مغفرته.","الودود: يحب عباده، ويتودد إليهم بالنعم، ويحب منهم أن يتوددوا إليه بالطاعة.","ما أجمل أن يجتمع في قلبك الخوف من ذنبك، والرجاء في غفران ربك، والحب لوده وقربه."]),z("k6","الرزاق الكريم",["الرزاق: يرزق النملة في جحرها، والطير في وكره، والجنين في بطن أمه. أفينسى رزقك أنت؟","الكريم: إذا أعطى أدهش. يعطي بلا حساب، وبلا من، وبلا انتظار مقابل.","لا تطلب رزقك بمعصيته، فإن ما عند الله لا ينال إلا بطاعته. واطلبه بقلب متوكل، وسعي جميل."]),z("k7","الشافي",["الشافي: يشفي القلوب من أمراضها، والأبدان من أسقامها. ما من داء إلا وله دواء، علمه من علمه.","إذا مرضت فهو يشفين. ليس الطبيب هو الشافي، بل الله. والطبيب سبب، والشفاء من الله.","اشف قلبك أولا من الحقد والحسد والكبر، يشف جسدك تبعا لذلك. فإن كثيرا من أمراض الجسد من أمراض القلب."]),z("k8","الهادي",["الهادي: يهدي من يشاء إلى صراط مستقيم. الهداية بيده، لا بيد أحد سواه.","اهدنا الصراط المستقيم. تطلبها كل يوم سبع عشرة مرة في صلواتك، لأنك لا تملك هداية نفسك.","إذا أراد الله هدايتك، فتح لك بابا من حيث لا تحتسب: آية تسمعها، كلمة تقرأها، موقف يهز قلبك."]),z("k9","القريب المجيب",["القريب: قريب منك، أقرب إليك من حبل الوريد. يسمع همسك، ويرى دمعك، ويعلم حاجتك.","المجيب: يجيب دعوة الداعي إذا دعاه. وعد، ومن أصدق من الله قيلا؟","لا تقل دعوت فلم يستجب لي. فإنه يجيبك بما هو خير لك: إما يعطيك ما سألت، أو يدفع عنك سوءا، أو يدخرها لك يوم القيامة."]),z("k10","خاتمة المعرفة",["
