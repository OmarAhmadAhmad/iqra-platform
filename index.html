<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطريقة الجامعة - المكتبة الرقمية والأوراد</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h1 class="app-title">📖 المكتبة الرقمية والأوراد - الطريقة الجامعة</h1>
            <button id="themeToggle" class="theme-btn" title="تبديل المظهر">🌓</button>
        </div>
        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن كتاب، أورد، أو درس..." />
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar" id="appSidebar">
            <div class="sidebar-header">
                <h3>📁 أقسام المكتبة</h3>
                <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" onclick="filterCategory('all', event)">📚 كافة الكتب والكتيبات</a>
                <a href="#" class="nav-item" onclick="filterCategory('favorites', event)">❤️ المفضلة</a>
                <hr class="nav-divider">
                <div id="categoriesList"></div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="category-tabs" id="categoryTabs"></div>
            <div id="sectionsContainer" class="sections-container"></div>
        </main>
    </div>

    <footer class="app-footer">
        <p>مكتبة الطريقة الجامعة | تأليف وتجميع: الشيخ أحمد مصطفى محمد مصطفى (أحمد البسفي)</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
