<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إقرا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .book-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: translateY(-3px);
        }
        .book-card h3 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .book-card p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 8px 15px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover {
            background: #2980b9;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة إقرا</h1>
        <p>المكتبة الرقمية وسلسلة المصابيح</p>
    </header>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <input type="text" id="search-input" class="search-box" placeholder="ابحث عن كتاب أو مصباح...">

        <!-- حاوية الكتب التي سيتم تعبئتها تلقائياً -->
        <div class="books-grid" id="books-container">
            <div class="loading">جاري تحميل المكتبة...</div>
        </div>
    </div>

    <script>
        let allBooks = [];

        // جلب قائمة الكتب تلقائياً من ملف books-list.json
        fetch('data/books-list.json')
            .then(response => response.json())
            .then(books => {
                allBooks = books;
                displayBooks(allBooks);
            })
            .catch(error => {
                document.getElementById('books-container').innerHTML = '<p style="color:red; text-align:center;">تعذر تحميل قائمة الكتب.</p>';
            });

        // دالة لعرض الكتب على شكل بطاقات
        function displayBooks(books) {
            const container = document.getElementById('books-container');
            if (books.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد كتب مطابقة للبحث.</p>';
                return;
            }

            container.innerHTML = books.map(book => `
                <div class="book-card">
                    <div>
                        <h3>${book.title}</h3>
                        <p>${book.category || 'قسم المصابيح والأذكار'}</p>
                    </div>
                    <a href="reader.html?file=${book.file}" class="btn">قراءة الكتاب</a>
                </div>
            `).join('');
        }

        // تفعيل البحث الفوري
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allBooks.filter(book => book.title.toLowerCase().includes(term));
            displayBooks(filtered);
        });
    </script>

</body>
</html>
