<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الطريقة الجامعة - الشيخ أحمد البسفي</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d5c53">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الطريقة الجامعة">
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <!-- شريط علوي فخم بلمسة إيمانية -->
    <header class="app-top-nav">
        <div class="nav-brand">
            <span class="brand-icon">🌿</span>
            <div>
                <h1>مكتبة الطريقة الجامعة</h1>
                <p id="greetingText">ملاذك اليومي للذكر والفكر</p>
            </div>
        </div>
        <button id="themeToggle" class="theme-circle-btn" title="تبديل الوضع">🌓</button>
    </header>

    <main class="main-viewport">
        <!-- شريط البحث الفوري المطور -->
        <div class="search-bar-modern">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ابحث في الأذكار، المصابيح، والدروس المسجلة..." autocomplete="off">
        </div>

        <!-- بطاقة متابعة القراءة والورد الذكية -->
        <div id="continueReadingSection" class="hero-continue-card" style="display: none;">
            <div class="hero-continue-info">
                <span class="badge-reading">🔖 متابعة الورد الحالي</span>
                <h3 id="continueBookTitle">اسم الكتاب</h3>
            </div>
            <a id="continueBookBtn" href="#" class="hero-action-btn">استكمال الورد ➔</a>
        </div>

        <!-- مساحة عرض الأقسام والكتب -->
        <div id="sectionsContainer" class="library-sections-space"></div>
    </main>

    <!-- شريط التنقل السفلي الثابت (Bottom Bar) -->
    <nav class="bottom-nav-bar">
        <button class="b-nav-item active" onclick="switchNavTab('all', this)">
            <span class="b-icon">📚</span>
            <span>المكتبة</span>
        </button>
        <button class="b-nav-item" onclick="switchNavTab('favorites', this)">
            <span class="b-icon">⭐</span>
            <span>أورادي المفضلة (<span id="favCount">0</span>)</span>
        </button>
    </nav>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>
</html>
