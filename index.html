<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الطريقة الجامعة - الشيخ أحمد البسفي</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="الطريقة الجامعة">
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="header-top-bar">
            <div class="brand-badge">
                <span class="pulse-dot"></span> مكتبة أوفلاين آمنة
            </div>
            <button id="themeToggle" class="theme-btn" title="تبديل المظهر النهاري/الليلي">🌓</button>
        </div>

        <div class="hero-title">
            <h1>مكتبة الطريقة الجامعة</h1>
            <p class="subtitle">للشيخ أحمد البسفي الأول بن مصطفى</p>
        </div>

        <div class="disclaimer-banner">
            <p>💡 <b>تنويه إداري:</b> جهد شخصي مخصص لنشر الذكر والدرس اليومي، وليس إصداراً رسمياً عن الطريقة.</p>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ابحث الفوري في الأذكار، المصابيح، والدروس..." autocomplete="off">
        </div>
    </header>

    <main class="main-container">
        <!-- بطاقة متابعة القراءة الذكية -->
        <div id="continueReadingSection" class="continue-pill-card" style="display: none;">
            <div class="pill-content">
                <span class="pill-tag">🔖 استكمال الورد</span>
                <h4 id="continueBookTitle">اسم الكتاب</h4>
            </div>
            <a id="continueBookBtn" href="#" class="pill-action-btn">تابع القراءة ➔</a>
        </div>

        <!-- تبويبات التبديل بين الكل والمفضلة -->
        <div class="segmented-control">
            <button id="tabAll" class="segment-btn active" onclick="switchMainView('all')">📚 كافة الأقسام والكتب</button>
            <button id="tabFav" class="segment-btn" onclick="switchMainView('favorites')">⭐ المفضلة الخاصة (<span id="favCount">0</span>)</button>
        </div>

        <!-- حاوية عرض الكتب والتصنيفات -->
        <div id="sectionsContainer" class="sections-container"></div>
    </main>

    <footer class="app-footer">
        <p>مكتبة الطريقة الجامعة &copy; 2026</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>
</html>
