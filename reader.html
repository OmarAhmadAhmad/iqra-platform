<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة الكتاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fcf9f2;
            color: #2c2c2c;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #555;
            background: #f0f0f0;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: #e2e2e2;
        }
        h1 {
            font-size: 1.5rem;
            color: #1b4d3e;
            margin-bottom: 10px;
        }
        .meta {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .content {
            font-size: 1.1rem;
            white-space: pre-wrap;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← عودة للمكتبة</a>
        <div id="book-container">
            <div class="loading">جاري تحميل الكتاب...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (!fileName) {
            document.getElementById('book-container').innerHTML = '<p style="color:red; text-align:center;">لم يتم تحديد الكتاب المطلوب.</p>';
        } else {
            fetch(`data/${fileName}`)
                .then(res => {
                    if (!res.ok) throw new Error('فشل في جلب ملف الكتاب');
                    return res.json();
                })
                .then(book => {
                    document.getElementById('book-container').innerHTML = `
                        <h1>${book.title || 'بدون عنوان'}</h1>
                        <div class="meta">المؤلف: ${book.author || 'غير محدد'}</div>
                        <div class="content">${book.content || book.description || 'لا توجد محتويات متاحة.'}</div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('book-container').innerHTML = '<p style="color:red; text-align:center;">تعذر تحميل محتوى الكتاب. تأكد من مسار الملف داخل مجلد data.</p>';
                });
        }
    </script>
</body>
</html>
