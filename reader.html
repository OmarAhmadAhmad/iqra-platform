<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">قراءة الكتاب - مكتبة الطريقة الجامعة</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شريط تقدم القراءة الاحترافي -->
    <div id="progressBar" class="progress-bar"></div>

    <main class="main-container reader-layout">
        <div class="reader-card">
            <div class="reader-topbar">
                <h2 id="bookTitle">جاري تحميل المحتوى...</h2>
                <div class="reader-controls-group">
                    <button id="favoriteBtn" class="action-chip">⭐ أضف للمفضلة</button>
                    <a href="index.html" class="action-chip back-chip">← المكتبة</a>
                </div>
            </div>
            
            <div id="bookContent" class="book-content">
                <p style="text-align: center; color: var(--text-secondary); padding: 40px;">جاري إعداد محتوى القراءة...</p>
            </div>
        </div>
    </main>

    <script src="js/reader.js"></script>
</body>
</html>
