<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">قراءة الكتاب - مكتبة الطريقة الجامعة</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-container" style="padding-top: 20px;">
        <div class="reader-container">
            <div class="reader-header">
                <div class="reader-title-area">
                    <h2 id="bookTitle">جاري التحميل...</h2>
                </div>
                <!-- أدوات القارئ المريحة والمفضلة -->
                <div class="reader-actions">
                    <div class="font-controls">
                        <button id="zoomOutBtn" class="font-btn" title="تصغير الخط">A-</button>
                        <button id="zoomInBtn" class="font-btn" title="تكبير الخط">A+</button>
                    </div>
                    <button id="favoriteBtn" class="fav-action-btn" title="إضافة للمفضلة">⭐ أضف للمفضلة</button>
                    <a href="index.html" class="back-link">← العودة للمكتبة</a>
                </div>
            </div>
            
            <div id="bookContent" class="book-content">
                <p style="text-align: center; color: var(--text-secondary);">جاري تحميل محتوى الكتاب...</p>
            </div>
        </div>
    </main>

    <script src="js/reader.js"></script>
</body>
</html>
