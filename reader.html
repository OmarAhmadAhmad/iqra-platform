<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة الكتاب - منصة إقرا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fcf9f2; /* خلفية دافئة مريحة جداً للقراءة الطويلة */
            color: #2c2c2c;
            margin: 0;
            padding: 20px;
            line-height: 2;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f0e6d2;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
            text-decoration: none;
            color: #555;
            background: #f4efe6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #e8dfd0;
        }
        h1 {
            font-size: 1.8rem;
            color: #1b4d3e;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .meta {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 2px solid #f7f3ec;
            padding-bottom: 15px;
        }
        .content {
            font-size: 1.15rem;
            white-space: pre-wrap;
            color: #333;
        }
        .loading, .error-msg {
            text-align: center;
            color: #666;
            padding: 50px;
            font-size: 1.1rem;
        }
        .error-msg {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← عودة للمكتبة الرئيسية</a>
        <div id="book-container">
            <div class="loading">جاري تحميل محتوى الكتاب...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (!fileName) {
            document.getElementById('book-container').innerHTML = '<div class="error-msg">لم يتم تحديد الكتاب المطلوب. الرجوع إلى المكتبة واختيار كتاب.</div>';
        } else {
            fetch(`data/${fileName}`)
                .then(res => {
                    if (!res.ok) throw new Error('فشل في جلب ملف الكتاب');
                    return res.json();
                })
                .then(book => {
                    document.title = `${book.title || 'قراءة الكتاب'} - منصة إقرا`;
                    document.getElementById('book-container').innerHTML = `
                        <h1>${book.title || 'بدون عنوان'}</h1>
                        <div class="meta"><strong>المؤلف:</strong> ${book.author || 'أحمد مصطفى محمد مصطفى (أحمد البسفي)'}</div>
                        <div class="content">${book.content || 'لا توجد محتويات متاحة في هذا الكتاب حالياً.'}</div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('book-container').innerHTML = '<div class="error-msg">تعذر تحميل محتوى الكتاب. تأكد من وجود ملف الـ JSON داخل مجلد data.</div>';
                });
        }
    </script>
</body>
</html>
