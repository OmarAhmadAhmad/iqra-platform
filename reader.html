<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة الكتاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfbf7; /* لون ورقي مريح جداً للقراءة */
            color: #2c2c2c;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #eae6df;
        }
        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #111;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #111;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .chapter {
            margin-bottom: 30px;
        }
        .chapter h3 {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 10px;
        }
        .chapter-content {
            font-size: 1.05rem;
            color: #333;
        }
        .chapter-content p {
            margin-bottom: 15px;
        }
        .msg {
            text-align: center;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back">← الرجوع إلى القائمة</a>
        <div id="content">
            <div class="msg">جاري تحميل الكتاب...</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');

        if (!fileName) {
            document.getElementById('content').innerHTML = '<p class="msg">لم يتم تحديد كتاب.</p>';
        } else {
            fetch(`data/${fileName}`)
                .then(res => res.json())
                .then(book => {
                    let html = `<h1>${book.title}</h1>`;
                    if (book.chapters && book.chapters.length > 0) {
                        html += book.chapters.map(ch => `
                            <div class="chapter">
                                <h3>${ch.title || ''}</h3>
                                <div class="chapter-content">${ch.content}</div>
                            </div>
                        `).join('');
                    }
                    document.getElementById('content').innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('content').innerHTML = '<p class="msg" style="color:red;">تعذر تحميل محتوى الكتاب.</p>';
                });
        }
    </script>
</body>
</html>
