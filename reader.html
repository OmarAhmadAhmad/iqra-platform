<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">قراءة الورد - مكتبة الطريقة الجامعة</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="reader-body">

    <!-- شريط التقدم النوراني في القراءة -->
    <div id="progressBar" class="reading-progress-line"></div>

    <!-- هيدر القراءة العائم -->
    <header class="reader-floating-header">
        <a href="index.html" class="float-back-btn">← المكتبة</a>
        <h2 id="bookTitle" class="float-title">جاري التحميل...</h2>
        <div class="header-actions-group">
            <button id="favoriteBtn" class="float-fav-btn" title="المفضلة">⭐</button>
            <button id="shareBtn" class="float-share-btn" title="مشاركة النص">📲</button>
        </div>
    </header>

    <main class="reader-viewport">
        <div class="reader-paper-sheet">
            <div id="bookContent" class="book-text-content">
                <p style="text-align: center; color: var(--text-secondary); padding: 50px;">جاري إعداد محتوى الورد...</p>
            </div>
        </div>
    </main>

    <script src="js/reader.js"></script>
</body>
</html>
