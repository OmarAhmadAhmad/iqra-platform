<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ الكتب التفاعلي - منصة إقرأ</title>
    <style>
        :root {
            --primary-color: #1b4d3e;
            --secondary-color: #d4af37;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2d9c5;
        }
        body {
            font-family: 'Amiri', 'Traditional Arabic', serif, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), #0f2e24);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 4px solid var(--secondary-color);
            position: relative;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #f3e5ab;
        }
        .back-link {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #f3e5ab;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.2);
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        /* التنقل بين الفصول / النوافذ */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .tab-btn {
            background-color: #e9e4d4;
            border: none;
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background-color: var(--secondary-color);
            color: #1b4d3e;
            transform: translateY(-2px);
        }
        .chapter-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
        }
        .chapter-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            margin-top: 0;
        }
        p, li {
            font-size: 1.1rem;
            text-align: justify;
        }
        blockquote {
            background: #fdfaf3;
            border-right: 5px solid var(--secondary-color);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 4px;
            font-style: italic;
            color: #333;
        }
        footer {
            text-align: center;
            padding: 2rem;
            background: #2c3e50;
            color: white;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← العودة للمكتبة</a>
        <h1 id="bookTitle">جاري تحميل الكتاب...</h1>
        <p id="bookAuthor"></p>
    </header>

    <div class="container">
        <div id="navTabs" class="nav-tabs"></div>
        <div id="chaptersContainer"></div>
    </div>

    <footer>
        <p>منصة إقرأ التفاعلية</p>
    </footer>

    <script>
        async function loadBookContent() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookFile = urlParams.get('book');

            if (!bookFile) {
                document.getElementById('bookTitle').innerText = 'لم يتم تحديد كتاب';
                return;
            }

            try {
                const response = await fetch(`data/${bookFile}`);
                const book = await response.json();

                document.getElementById('bookTitle').innerText = book.title;
                document.getElementById('bookAuthor').innerText = `تأليف: ${book.author}`;

                const navTabs = document.getElementById('navTabs');
                const chaptersContainer = document.getElementById('chaptersContainer');

                book.chapters.forEach((chapter, index) => {
                    const chapterNum = index + 1;

                    // إنشاء زر الفهرس العلوي
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = `النافذة ${chapterNum}`;
                    btn.onclick = (e) => switchChapter(chapterNum, e);
                    navTabs.appendChild(btn);

                    // إنشاء بطاقة الفصل
                    const card = document.createElement('div');
                    card.id = `chapter-${chapterNum}`;
                    card.className = `chapter-card ${index === 0 ? 'active' : ''}`;
                    card.innerHTML = `
                        <h2>${chapter.title}</h2>
                        <div>${chapter.content}</div>
                    `;
                    chaptersContainer.appendChild(card);
                });

            } catch (error) {
                console.error('خطأ في تحميل الكتاب:', error);
                document.getElementById('bookTitle').innerText = 'عذراً، حدث خطأ في تحميل بيانات الكتاب.';
            }
        }

        function switchChapter(chapterNum, event) {
            document.querySelectorAll('.chapter-card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`chapter-${chapterNum}`).classList.add('active');
            event.target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadBookContent();
    </script>
</body>
</html>
