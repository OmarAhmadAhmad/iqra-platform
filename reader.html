<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ الكتب الرقمي - دلائل الخيرات</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- مكتبة PDF.js لعرض ملفات الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* شريط أوراد الأيام التفاعلي */
        .wirds-nav-bar {
            background-color: #1b4d3e;
            color: white;
            padding: 10px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .wird-btn {
            background-color: #2c6b56;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .wird-btn:hover, .wird-btn.active {
            background-color: #d4af37;
            color: #1b4d3e;
            font-weight: bold;
        }
        /* منطقة العرض */
        #pdf-viewer-container {
            flex: 1;
            overflow: auto;
            text-align: center;
            padding: 20px;
            background-color: #525659;
        }
        canvas {
            max-width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        /* شريط التحكم السفلي */
        .pdf-controls {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #ddd;
        }
        .control-btn {
            background-color: #1b4d3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .control-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="reader-container">
    <!-- شريط أوراد الأيام السبعة التفاعلي المباشر -->
    <div class="wirds-nav-bar" id="wirdsBar">
        <button class="wird-btn" onclick="goToWird(14)">ورد الإثنين (الحزب 1)</button>
        <button class="wird-btn" onclick="goToWird(185)">ورد الثلاثاء (الحزب 2)</button>
        <button class="wird-btn" onclick="goToWird(194)">ورد الأربعاء (الحزب 3)</button>
        <button class="wird-btn" onclick="goToWird(204)">ورد الخميس (الحزب 4)</button>
        <button class="wird-btn" onclick="goToWird(213)">ورد الجمعة (الحزب 5)</button>
        <button class="wird-btn" onclick="goToWird(225)">ورد السبت (الحزب 6)</button>
        <button class="wird-btn" onclick="goToWird(238)">ورد الأحد (الحزب 7)</button>
    </div>

    <!-- حاوية عرض الصفحات -->
    <div id="pdf-viewer-container">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="pdf-controls">
        <button class="control-btn" id="prev-page">الصفحة السابقة</button>
        <span>صفحة <span id="page-num">1</span> من <span id="page-count">1</span></span>
        <button class="control-btn" id="next-page">الصفحة التالية</button>
        <button class="control-btn" onclick="window.location.href='index.html'" style="background-color: #b22222;">العودة للرئيسية</button>
    </div>
</div>

<script src="js/reader.js"></script>
</body>
</html>
